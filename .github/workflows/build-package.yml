name: Build Package

on:
  workflow_dispatch:

  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Send Hooks BigLinux Build Package
        shell: bash
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          jq -n --arg repo "$REPOSITORY" --arg branch "$BRANCH" \
            '{event_type: $repo, client_payload: {branch: $branch, url: "https://github.com/\($repo)"}}' |
          curl --fail-with-body -X POST -H "Accept: application/json" -H "Authorization: token $WEBHOOK_TOKEN" \
            --data @- https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
